[project]
name = "us-health-clustering"
version = "1.0.0"
description = "Clustering US states by public health and socio-economic indicators (CDC BRFSS, Census ACS/CBP, NOAA)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kaleido>=1.3.0",
    "matplotlib>=3.10",
    "numpy>=2.4",
    "pandas>=3.0",
    "plotly>=6.7",
    "scikit-learn>=1.8",
    "scipy>=1.17",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.4",
    "nbconvert>=7.16",
]
fetch = [
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ushealth"]
